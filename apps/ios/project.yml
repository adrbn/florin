name: Florin
options:
  bundleIdPrefix: com.adrbn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Adrien Robino (Individual, paid). The iPhone 16 Pro is already
    # registered under it, and the team owns a `2TWQF4T93E.*` wildcard
    # development profile, so any bundle id here is covered.
    DEVELOPMENT_TEAM: 2TWQF4T93E
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Florin:
    type: application
    platform: iOS
    sources:
      # The app ships no bundled fonts any more — it uses San Francisco
      # throughout — so there is no separate resources phase to declare.
      - path: Florin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adrbn.florin
        PRODUCT_NAME: Florin
        INFOPLIST_KEY_CFBundleDisplayName: Florin
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Florin/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.2.52"
