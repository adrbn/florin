name: Florin
options:
  bundleIdPrefix: com.adrbn
  deploymentTarget:
    # 17.4, for ASWebAuthenticationSession's https callback — the one way to
    # receive a bank's redirect without a custom scheme, which Enable Banking
    # refuses. Released March 2024, so the floor costs essentially nothing.
    iOS: "17.4"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Adrien Robino (Individual, paid). The iPhone 16 Pro is already
    # registered under it, and the team owns a `2TWQF4T93E.*` wildcard
    # development profile, so any bundle id here is covered.
    DEVELOPMENT_TEAM: 2TWQF4T93E
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Florin:
    type: application
    platform: iOS
    sources:
      # The app ships no bundled fonts any more — it uses San Francisco
      # throughout — so there is no separate resources phase to declare.
      - path: Florin
    entitlements:
      path: Florin/Florin.entitlements
      properties:
        # Lets iOS route the bank's https redirect to this app instead of a
        # browser. Must match BankingFlow.redirectHost and the redirect URI
        # registered with Enable Banking.
        com.apple.developer.associated-domains:
          # `?mode=developer` makes iOS fetch the association file straight
          # from the domain instead of waiting on Apple's CDN, which can lag by
          # hours after a first deploy. It only takes effect on a device with
          # developer mode on, and is ignored in App Store builds — so it costs
          # nothing to leave in and saves a day of wondering why nothing opens.
          - applinks:florin-cpe.pages.dev
          # `webcredentials`, not just `applinks`. ASWebAuthenticationSession's
          # https callback checks *this* service type, and says so only once it
          # has already refused: "Using HTTPS callbacks requires Associated
          # Domains using the webcredentials service type".
          - webcredentials:florin-cpe.pages.dev
          #
          # No `?mode=developer`. It tells iOS to fetch the association file
          # straight from the domain instead of Apple's CDN, which sounds like
          # the faster path — but it only takes effect behind a toggle buried in
          # Settings > Developer, and an app that needs someone to find that is
          # not an app anyone will use. Without it Apple's CDN does the check on
          # its own, which is exactly what happens for every App Store and
          # TestFlight install. Same path as a real user, so the same failures.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adrbn.florin
        PRODUCT_NAME: Florin
        INFOPLIST_KEY_CFBundleDisplayName: Florin
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Florin/Info.plist
        CURRENT_PROJECT_VERSION: 328
        MARKETING_VERSION: "1.2.52"
