<!doctype html>
<meta charset="utf-8">
<title>Florin</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  The page nobody should ever see.

  When the app is installed, iOS intercepts this URL as a universal link and
  hands it straight to Florin — this HTML is never fetched. It exists for the
  case where it is: a desktop browser, or a phone without the app, following a
  bank's redirect. Saying so plainly beats a 404, which looks like the bank
  failed rather than like the link needing the app.
-->
<style>
  :root { color-scheme: dark }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0D0E12; color: #FAFAFC;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    text-align: center; padding: 24px;
  }
  p { color: #A6A8B3; max-width: 34ch }
</style>
<main>
  <h1>Florin</h1>
  <p>Ouvrez ce lien sur l'iPhone où Florin est installé pour terminer la connexion à votre banque.</p>
</main>
